contract_version: generation-config-v1.0.0
config_id: o6_8-discover-openai-example
mode: discover

provider:
  name: openai
  api_style: codex_cli
  adapter_config_path: config/models/codex-gpt-5.5.json
  base_url_env: null
  credential_env: null

model:
  id: gpt-5.5
  temperature: 0.2
  top_p: 1.0
  seed: null
  max_output_tokens: 32000
  request_timeout_seconds: 600

inputs:
  source_manifest_path: sources/oepul/manifest.json
  source_selection:
    - source_id: o6_8
      clause_scopes:
        - "3.2"
        - "3.3"
        - "4.1"
        - "7"
  canonical_profile:
    profile_id: canonical-farm-profile-v1
    path: profiles/canonical_farm_profile.json
    schema_path: null
    expected_sha256: null
  prompts:
    system_path: AGENTS.md
    task_template_path: prompts/generate_measure.md

generation:
  objective: maximize_source_grounded_rule_extraction
  candidate_count: 3
  profile_edit_policy: validated_proposals
  require_rego_tests: true
  require_source_references: true
  require_exact_evidence: true
  require_coverage_ledger: true
  require_profile_change_proposals: true
  require_data_inventory: true

logging:
  raw_jsonl: true
  capture_requests: true
  capture_responses: true
  redact_credentials: true

run_layout:
  root_template: "runs/{run_id}"
  manifest_name: run.json
