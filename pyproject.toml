[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oepul-rule-lab"
version = "0.1.0"
description = "Model-switchable lab for source-grounded ÖPUL Rego generation"
requires-python = ">=3.11"
dependencies = ["pypdf>=5,<7"]

[project.scripts]
rulelab = "rulelab.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
